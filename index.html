<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Sprite</title>
    <link rel="icon" type="image/png" href="assets/Logo.png">
</head>

<body>
    <div id="main">
        <nav>
            <img class="img" src="assets/Logo.png" alt="Sprite logo">
            <div class="center-nav" data-nav-panel>
                <a href="#hero">Home</a>
                <a href="#products">Products</a>
                <a href="#story">Our Story</a>
                <a href="#contact">Contact</a>
                <button class="nav-cta">Find a Store</button>
            </div>
            <button class="menu-toggle" data-menu-toggle aria-label="Toggle navigation" aria-expanded="false">
                <i class="ri-menu-fill"></i>
            </button>
        </nav>
    </div>

    <div class="one" id="hero">
        <div class="hero-copy">
            <p class="eyebrow">Naturally zesty • Always refreshing</p>
            <h1>Sprite</h1>
            <p class="lede">
                Crisp lemon-lime bubbles blended with real citrus oils. Sprite delivers instant refreshment that cools
                you down and keeps you moving.
            </p>
            <div class="hero-btns">
                <button class="primary">Shop Now</button>
                <button class="secondary">Explore Flavours</button>
            </div>
            <div class="hero-stats">
                <div>
                    <h3>140+</h3>
                    <p>Countries cooled</p>
                </div>
                <div>
                    <h3>32g</h3>
                    <p>Real sugar</p>
                </div>
                <div>
                    <h3>100%</h3>
                    <p>Recyclable cans</p>
                </div>
            </div>
        </div>
        <img id="sprite" src="assets/Sprite.png" alt="Sprite bottle">
        <img id="lemon-cut" src="assets/Lemon.png" alt="Sliced lemon">
        <img id="lemon" src="assets/Lemons.png" alt="Whole lemon">
        <img id="leaf" src="assets/leaf.webp" alt="Leaf">
        <img id="leaf2" src="assets/leaf2.png" alt="Leaf">
        <img id="leaf3" src="assets/coconoutleaf.png" alt="Leaf">
    </div>
</body>

</html>
